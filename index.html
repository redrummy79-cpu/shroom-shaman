let dpr=1, scale=1, offX=0, offY=0, vw=0, vh=0, touchUI=false;

touchUI = isTouchDevice();
function resize(){
  vw = innerWidth; vh = innerHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.floor(vw*dpr); canvas.height = Math.floor(vh*dpr);
  canvas.style.width = vw+'px'; canvas.style.height = vh+'px';
  const portraitScreen = vh >= vw;
  // fresh board + orientation change => rebuild for the new orientation
  if(L && L.portrait !== portraitScreen && G && G.state==='aim' && G.shots===0) reset();
  if(!L) return;
  let ax=0, ay=0, aw=vw, ah=vh;
  controls.classList.toggle('on', touchUI);
  if(touchUI){
    if(portraitScreen){ const band = clamp(vh*0.14, 96, 130); ah = vh-band; layoutButtons('portrait', band); }
    else { const band = clamp(vw*0.12, 92, 130); ax = band; aw = vw-band*2; layoutButtons('landscape', band); }
  }
  scale = Math.min(aw/L.W, ah/L.H);
  offX = ax + (aw - L.W*scale)/2; offY = ay + (ah - L.H*scale)/2;
  placeMute(portraitScreen);
}
// Mute button: touch portrait -> bottom band between nudge and FIRE; touch landscape -> bottom of left band;
// desktop -> top-right corner of the board (right of the multiplier text / above the Spore Meter, or under it in portrait).
function placeMute(portraitScreen){
  const m = document.getElementById('btnMute'); if(!m) return;
  let cx, cy, d;
  if(touchUI && portraitScreen){
    const band = clamp(vh*0.14, 96, 130), nd = clamp(band*0.66, 64, 84), fd = clamp(band*0.86, 84, 112);
    const left = 14+nd*2+12, right = vw-14-fd; d = clamp(Math.min(band*0.48, right-left-12), 34, 58);
    cx = (left+right)/2; cy = vh - band/2;
  } else if(touchUI){
    const band = clamp(vw*0.12, 92, 130); d = clamp(band*0.5, 40, 58); cx = band/2; cy = vh - d/2 - 14;
  } else {
    d = clamp(56*scale, 34, 56);
    const lx = L.portrait ? L.W-48 : L.W-36, ly = L.portrait ? 300 : 52;
    cx = offX + lx*scale; cy = offY + ly*scale;
    cx = clamp(cx, d/2+4, vw-d/2-4); cy = clamp(cy, d/2+4, vh-d/2-4);
  }
  place(m, cx, cy, d); m.classList.add('show');
}
function place(el, cx, cy, d){ el.style.width=el.style.height=d+'px'; el.style.left=(cx-d/2)+'px'; el.style.top=(cy-d/2)+'px'; }
function layoutButtons(mode, band){
  if(mode==='portrait'){
    const fd = clamp(band*0.86, 84, 112), nd = clamp(band*0.66, 64, 84), cy = vh - band/2;
    place(btnL, 14+nd/2, cy, nd); place(btnR, 14+nd*1.5+12, cy, nd); place(btnFire, vw-14-fd/2, cy, fd);
  } else {
    const fd = clamp(band*0.85, 80, 110), nd = clamp(band*0.66, 62, 84);
    place(btnL, band/2, vh*0.5-nd*0.62, nd); place(btnR, band/2, vh*0.5+nd*0.62, nd); place(btnFire, vw-band/2, vh*0.62, fd);
  }
}

// ---------- Audio ----------
let actx = null;
let muted = false; try{ muted = localStorage.getItem('shroomShamanMuted')==='1'; }catch(e){}
const MUSIC_VOL = 0.45;
const music = document.getElementById('music');
const btnMute = document.getElementById('btnMute');
let musicGain = null, musicRouted = false;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); startMusic(); return actx; }
// iOS ignores element.volume, so on http(s) route the music through a WebAudio gain node.
// On file:// (local copy) WebAudio would output silence (CORS), so fall back to element.volume.
function routeMusic(){
  if(musicRouted || !actx || !music) return; musicRouted = true;
  if(location.protocol==='http:'||location.protocol==='https:'){
    try{ const src = actx.createMediaElementSource(music); musicGain = actx.createGain(); musicGain.gain.value = MUSIC_VOL;
      src.connect(musicGain); musicGain.connect(actx.destination); music.volume = 1; return; }catch(e){ musicGain = null; }
  }
  music.volume = MUSIC_VOL;
}
function startMusic(){
  if(!music || muted || document.hidden) return;
  routeMusic();
  if(music.paused){ const p = music.play(); if(p && p.catch) p.catch(()=>{}); }
}
function setMuted(v){
  muted = v; try{ localStorage.setItem('shroomShamanMuted', v?'1':'0'); }catch(e){}
  btnMute.classList.toggle('muted', v); btnMute.setAttribute('aria-pressed', v?'true':'false');
  if(v){ if(music) music.pause(); } else { audio(); }
}

btnMute.addEventListener('pointerup', e=>{ e.preventDefault(); e.stopPropagation(); btnMute.classList.remove('down'); setMuted(!muted); });
btnMute.addEventListener('pointercancel', ()=>btnMute.classList.remove('down'));
btnMute.addEventListener('pointerleave', ()=>btnMute.classList.remove('down'));

// any first gesture starts the music (iOS needs a user gesture)
['pointerdown','pointerup','touchend','keydown','click'].forEach(ev=>addEventListener(ev, ()=>{ if(!muted && music && music.paused) audio(); }, {capture:true, passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ if(music) music.pause(); if(actx && actx.state==='running') actx.suspend(); }
  else if(actx){ actx.resume(); startMusic(); }
});
window.__sound = { music, isMuted:()=>muted, setMuted };
function tone(freq, dur=0.15, type='sine', vol=0.15, slideTo=null, delay=0){
  const a = actx; if(!a || muted) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
const SCALE_STEPS = [0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36,38,40,43,45,48];

}

// ---------- Sprite cache (no per-frame shadowBlur: phone friendly) ----------
function mk(w,h){ const c=document.createElement('canvas'); c.width=Math.ceil(w); c.height=Math.ceil(h); return c; }
function glowSprite(color, r){ const c=mk(r*2,r*2), g=c.getContext('2d'); const gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,color); gr.addColorStop(0.25,color.replace(/[\d.]+\)$/,'0.45)')); gr.addColorStop(1,color.replace(/[\d.]+\)$/,'0)'));
  g.fillStyle=gr; g.fillRect(0,0,r*2,r*2); return c; }
const PEG_STYLE = {
  teal:   {stops:['#f2ffff','#8ffcf2','#1fc4c4','#0a6e7e','#04303d'], glow:'rgba(90,255,235,1)', rim:'rgba(200,255,250,0.8)'},
  orange: {stops:['#fff7cf','#ffd06a','#ff8a1c','#c43c06','#4a1202'], glow:'rgba(255,140,40,1)', rim:'rgba(255,220,150,0.8)'},
  power:  {stops:['#ffffff','#f2c4ff','#b04bff','#5a14b0','#22054a'], glow:'rgba(200,110,255,1)', rim:'rgba(255,220,255,0.9)'},
};
let PEGSPR = {};
function buildPegSprites(R){
  PEGSPR = {};
  const S = R*2*3.2;
  for(const type of ['teal','orange','power']) for(const lit of [false,true]){
    const st = PEG_STYLE[type], c = mk(S,S), g = c.getContext('2d'), m = S/2;
    // outer glow
    const gr = g.createRadialGradient(m,m,R*0.5,m,m,S/2);
    const ga = lit?0.95:0.55;
    gr.addColorStop(0, st.glow.replace(/1\)$/, ga+')')); gr.addColorStop(0.35, st.glow.replace(/1\)$/, (ga*0.35)+')')); gr.addColorStop(1, st.glow.replace(/1\)$/,'0)'));
    g.fillStyle=gr; g.fillRect(0,0,S,S);
    // body
    const b = g.createRadialGradient(m-R*0.35,m-R*0.4,R*0.05,m,m,R);
    const s = lit ? ['#ffffff','#ffffff',st.stops[1],st.stops[2],st.stops[3]] : st.stops;
    b.addColorStop(0,s[0]); b.addColorStop(0.22,s[1]); b.addColorStop(0.55,s[2]); b.addColorStop(0.85,s[3]); b.addColorStop(1,s[4]);
    g.fillStyle=b; g.beginPath(); g.arc(m,m,R,0,TAU); g.fill();
    if(type==='teal'){ // crystal facets
      g.save(); g.beginPath(); g.arc(m,m,R*0.98,0,TAU); g.clip(); g.globalAlpha=0.28; g.fillStyle='#ffffff';
      for(let i=0;i<6;i++){ const a=i*TAU/6+0.3; g.beginPath(); g.moveTo(m,m); g.lineTo(m+Math.cos(a)*R,m+Math.sin(a)*R); g.lineTo(m+Math.cos(a+0.5)*R,m+Math.sin(a+0.5)*R); g.closePath(); if(i%2===0) g.fill(); }
      g.restore();
    }
    if(type==='orange'){ // ember cracks
      g.save(); g.beginPath(); g.arc(m,m,R*0.95,0,TAU); g.clip(); g.strokeStyle=lit?'rgba(255,255,220,0.8)':'rgba(255,240,150,0.65)'; g.lineWidth=Math.max(1,R*0.08);
      for(let i=0;i<4;i++){ let x=m+rand(-R*0.6,R*0.6), y=m+rand(-R*0.6,R*0.6); g.beginPath(); g.moveTo(x,y); for(let k=0;k<3;k++){ x+=rand(-R*0.4,R*0.4); y+=rand(-R*0.4,R*0.4); g.lineTo(x,y);} g.stroke(); }
      g.restore();
    }
    // rim
    g.strokeStyle=st.rim; g.lineWidth=Math.max(1,R*0.1); g.beginPath(); g.arc(m,m,R*0.95,0,TAU); g.stroke();
    // speculars
    g.fillStyle='rgba(255,255,255,0.9)'; g.beginPath(); g.ellipse(m-R*0.38,m-R*0.42,R*0.3,R*0.18,-0.6,0,TAU); g.fill();
    g.fillStyle='rgba(255,255,255,0.45)'; g.beginPath(); g.arc(m+R*0.4,m+R*0.42,R*0.1,0,TAU); g.fill();
    PEGSPR[type+(lit?'1':'0')] = c;
  }
}
let GLOW_GOLD, GLOW_LIME, GLOW_FF, GLOW_WHITE, BALLSPR;
function buildMiscSprites(){
  GLOW_GOLD = glowSprite('rgba(255,220,120,1)', 64);

  g.fillStyle=gr; g.beginPath(); g.arc(R,R,R,0,TAU); g.fill();

// ---------- Background (painted image + dimming + pond) ----------
let bgCanvas = null;
function buildBG(){
  bgCanvas = mk(L.W, L.H); const g = bgCanvas.getContext('2d');
  const img = L.portrait ? IMG.bgP : IMG.bgL;
  const s = Math.max(L.W/img.width, L.H/img.height);
  const w = img.width*s, h = img.height*s;
  g.drawImage(img, (L.W-w)/2, (L.H-h)*0.6, w, h);
  // dim center so pegs pop
  const cx=L.W/2, cy=L.H*0.55;
  const gr = g.createRadialGradient(cx,cy,0,cx,cy,Math.max(L.W,L.H)*0.6);
  gr.addColorStop(0,'rgba(6,3,20,0.55)'); gr.addColorStop(0.6,'rgba(6,3,20,0.3)'); gr.addColorStop(1,'rgba(6,3,20,0.05)');
  g.fillStyle=gr; g.fillRect(0,0,L.W,L.H);
  // glowing pond band
  const pg = g.createLinearGradient(0,L.pondY-20,0,L.H);
  pg.addColorStop(0,'rgba(40,200,190,0)'); pg.addColorStop(0.15,'rgba(40,190,190,0.35)'); pg.addColorStop(1,'rgba(4,30,45,0.85)');
  g.fillStyle=pg; g.fillRect(0,L.pondY-20,L.W,L.H-L.pondY+20);
  g.strokeStyle='rgba(170,255,240,0.18)'; g.lineWidth=2;
  for(let i=0;i<30;i++){ g.beginPath(); g.ellipse(rand(0,L.W), rand(L.pondY+15,L.H-10), rand(20,70), rand(2,4),0,0,TAU); g.stroke(); }
  // side wall hints
  g.fillStyle='rgba(120,255,220,0.06)'; g.fillRect(L.wallL-4,0,4,L.pondY); g.fillRect(L.wallR,0,4,L.pondY);
}

// ---------- Level / pegs ----------
let pegs = [];
function buildLevel(){
  const pts = [], R=L.pegR, md=L.minDist;
  const add = (x,y)=>{ if(y<L.pegTop||y>L.pegBottom||x<L.wallL+R+14||x>L.wallR-R-14) return; for(const p of pts){ if((p.x-x)**2+(p.y-y)**2 < md*md) return; } pts.push({x,y}); };
  if(L.portrait){
    const cx=450, capY=800;
    for(const [rx,ry,n] of [[395,315,24],[300,228,18],[200,140,12]]) for(let i=0;i<=n;i++){ const a=Math.PI+Math.PI*i/n; add(cx+Math.cos(a)*rx, capY+Math.sin(a)*ry); }
    for(let x=cx-376;x<=cx+376;x+=47) add(x, capY+36);
    for(let y=capY+100;y<=1270;y+=50){ add(cx-58,y); add(cx+58,y); }
    for(let y=capY+125;y<=1270;y+=100) add(cx,y);
    for(let i=0;i<=8;i++){ const a=Math.PI*i/8; add(cx+Math.cos(a)*140, 1300+Math.sin(a)*26); }
    let row=0;
    for(let y=L.pegTop; y<=L.pegBottom; y+=62, row++){
      for(let x=L.wallL+40+(row%2?38:0); x<=L.wallR-30; x+=76){
        const inDome = y<capY+20 && ((x-cx)/440)**2+((y-capY)/360)**2 < 1;
        const gill = y>=capY-10 && y<capY+80 && Math.abs(x-cx)<430;
        const stem = y>=capY && Math.abs(x-cx)<120;
        const base = y>1240 && Math.abs(x-cx)<200;
        if(!inDome && !gill && !stem && !base) add(x,y);
      }
    }
  } else {
    const cx = 900, capY = 650;
    for(const [rx,ry,n] of [[440,275,30],[350,195,24],[250,115,16]]) for(let i=0;i<=n;i++){ const a=Math.PI+Math.PI*i/n; add(cx+Math.cos(a)*rx, capY+Math.sin(a)*ry); }
    for(let x=cx-420;x<=cx+420;x+=42) add(x, capY+30);
    for(let y=capY+80;y<=870;y+=40){ add(cx-60,y); add(cx+60,y); }
    for(let y=capY+100;y<=870;y+=80) add(cx,y);
    for(let i=0;i<=8;i++){ const a=Math.PI*i/8; add(cx+Math.cos(a)*120, 900+Math.sin(a)*20); }
    for(const [x0,x1] of [[110,430],[1370,1690]]){ let row=0; for(let y=375;y<=910;y+=62,row++) for(let x=x0+(row%2?37:0); x<=x1; x+=74) add(x,y); }
    for(const sx of [460,1340]) for(let i=0;i<10;i++){ const a=i*0.75, r=20+i*9; add(sx+Math.cos(a)*r*(sx<900?1:-1), 880+Math.sin(a)*r*0.5-30); }
  }
  pegs = pts.map(p=>({x:p.x,y:p.y,type:'teal',lit:false,alive:true,pop:0,ph:Math.random()*TAU}));
  const idx = pegs.map((_,i)=>i).sort(()=>Math.random()-0.5);
  for(let i=0;i<25 && i<idx.length;i++) pegs[idx[i]].type='orange';
  placePowerPeg();
}
function placePowerPeg(){
  for(const p of pegs) if(p.type==='power' && !p.lit) p.type='teal';
  const teal = pegs.filter(p=>p.alive && !p.lit && p.type==='teal');
  if(teal.length) teal[Math.floor(Math.random()*teal.length)].type='power';
}

// ---------- Input ----------
function toLogical(e){ return {x:(e.clientX-offX)/scale, y:(e.clientY-offY)/scale}; }
function aimAt(p){
  let a = Math.atan2(p.y-PIVOT.y, p.x-PIVOT.x);
  if(a < -Math.PI/2) a += TAU;          // upper-left quadrant -> beyond PI
  G.aim = clamp(a, AIM_MIN, AIM_MAX);
}
function btnRect(){ const w=L.portrait?420:280, h=L.portrait?110:74; return {x:L.W/2-w/2, y:L.portrait?L.H*0.6:700, w, h}; }
function inBtn(p){ const b=btnRect(); return p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h; }
let dragId = null;
canvas.addEventListener('pointerdown', e=>{
  audio(); e.preventDefault();
  const p = toLogical(e);
  if(e.pointerType!=='mouse' && !touchUI){ touchUI=true; resize(); }

// ---------- Physics ----------
const REST = 0.78;
const AIM_MIN = -0.33, AIM_MAX = Math.PI+0.33; // ~19 deg above horizontal each side
function collideBody(b, r, onHit){
  if(b.x<L.wallL+r){ b.x=L.wallL+r; b.vx=Math.abs(b.vx)*0.85; }
  if(b.x>L.wallR-r){ b.x=L.wallR-r; b.vx=-Math.abs(b.vx)*0.85; }
  if(b.y<r){ b.y=r; b.vy=Math.abs(b.vy)*0.8; }
  const PR = L.pegR;
  for(const p of pegs){
    if(!p.alive) continue;
    const dx=b.x-p.x, dy=b.y-p.y, rr=r+PR, d2=dx*dx+dy*dy;
    if(d2<rr*rr && d2>0.0001){
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d;
      b.x = p.x+nx*rr; b.y = p.y+ny*rr;
      const vn = b.vx*nx+b.vy*ny;
      if(vn<0){ b.vx -= (1+REST)*vn*nx; b.vy -= (1+REST)*vn*ny; b.vx += rand(-8,8); }
      onHit(p);
    }
  }
}
function step(dt){
  G.time += dt;
  const c = G.catcher; c.t += dt;
  c.x = L.W/2 + Math.sin(c.t*0.55)*L.catcherAmp;
  if(c.angry>0){ c.angry -= dt; if(c.angry<=0){ c.grumble = 1.6; grumble(); floatText(c.x, L.catcherY-110, 'grumble… zzz', '#cdb8ff', 30, 1.6); } }
  if(c.grumble>0) c.grumble -= dt;
  for(const b of G.balls){
    b.vy += L.grav*dt; b.x += b.vx*dt; b.y += b.vy*dt;
    const cap = b.boost>0 ? 2400 : 1450; if(b.boost>0) b.boost-=dt; const sp = Math.hypot(b.vx,b.vy); if(sp>cap){ b.vx*=cap/sp; b.vy*=cap/sp; }
    collideBody(b, L.ballR, hitPeg);
    b.histT += dt;
    if(b.histT>0.25){ b.histT=0; b.hist.push({x:b.x,y:b.y}); if(b.hist.length>6){ b.hist.shift();
      const o=b.hist[0]; if(Math.hypot(b.x-o.x,b.y-o.y)<30){ unstick(b); b.hist=[]; } } }
    if(!G.flungThisShot && b.y>L.catcherY-12 && b.y<L.catcherY+30 && b.vy>0 && Math.abs(b.x-c.x)<L.catcherW/2){
      madFrogFling(b);
    }
    if(b.y>L.H+30) b.dead=true;
  }
  G.balls = G.balls.filter(b=>!b.dead);
  for(const f of G.frogs){
    f.life -= dt; f.squash = Math.max(0,f.squash-dt*4);
    f.vy += L.grav*dt; f.x += f.vx*dt; f.y += f.vy*dt;   // same gravity as the seed, no mid-air hops
    const sp = Math.hypot(f.vx,f.vy); if(sp>1450){ f.vx*=1450/sp; f.vy*=1450/sp; }
    if(f.y < f.apexY) f.apexY = f.y;                      // highest point reached so far
    frogCollide(f);
    if(f.y>L.H+40 || f.life<=0){ f.dead=true; burst(f.x,Math.min(f.y,L.H-20),'#c9ff8a',20,250); if(f.life<=0) tone(500,0.15,'sine',0.06,900); }
  }
  G.frogs = G.frogs.filter(f=>!f.dead);
  if(G.state==='flying' && G.balls.length===0 && G.frogs.length===0){
    G.clearQueue = pegs.filter(p=>p.alive && p.lit).sort((a,b)=>a.y-b.y);
    G.state='clearing'; G.clearTimer=0;
    if(G.shotScore>0) floatText(L.W/2,L.pegTop-10,'Shot: +'+G.shotScore,'#fff',44,1.6);
  }
  for(const p of G.particles){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.firefly){ p.vx*=0.985; p.vy=p.vy*0.985-10*dt; } else p.vy+=500*dt; }
  if(G.particles.length>700) G.particles.splice(0, G.particles.length-700);
  G.particles = G.particles.filter(p=>p.life>0);
  for(const t of G.texts){ t.life-=dt; t.y-=30*dt; }
  G.texts = G.texts.filter(t=>t.life>0);
  for(const p of pegs) if(!p.alive && p.pop>0) p.pop-=dt*3;
}
// Swarm frogs: walls/ceiling bounce like the seed; touching a peg clears it and the frog hops off it.
// Hop height is capped so a frog never climbs much above the highest point it already reached.
function frogCollide(f){
  const r = L.frogR;
  if(f.x<L.wallL+r){ f.x=L.wallL+r; f.vx=Math.abs(f.vx)*0.85; f.face=1; }
  if(f.x>L.wallR-r){ f.x=L.wallR-r; f.vx=-Math.abs(f.vx)*0.85; f.face=-1; }
  if(f.y<r){ f.y=r; f.vy=Math.abs(f.vy)*0.8; }
  const PR = L.pegR;
  for(const p of pegs){
    if(!p.alive) continue;
    const dx=f.x-p.x, dy=f.y-p.y, rr=r+PR, d2=dx*dx+dy*dy;
    if(d2>=rr*rr) continue;
    const d=Math.sqrt(Math.max(d2,1e-4)), nx=d2>1e-4?dx/d:0, ny=d2>1e-4?dy/d:-1;
    f.x = p.x+nx*rr; f.y = p.y+ny*rr;
    hitPeg(p); p.alive=false; p.pop=1; burst(p.x,p.y,'#c9ff8a',8,160);
    if(ny < 0.35){
      // landed on / glanced the top of the peg -> hop (up + slightly random sideways)
      const g = L.grav, maxRise = Math.max(0, f.y - (f.apexY - 30));   // allow ~30px above previous apex
      const up = Math.min(rand(420,620), Math.sqrt(2*g*maxRise));
      let side = nx*rand(120,260) + rand(-140,140);
      if(Math.abs(side)<60) side = (Math.random()<0.5?-1:1)*rand(60,160);
      f.vx = clamp(f.vx*0.3 + side, -420, 420); f.vy = -up;
      f.face = f.vx<0?-1:1; f.squash = 1;
      burst(f.x,f.y+10,'#c9ff8a',8,140);
      if(Math.random()<0.6) ribbit();
    } else {
      // hit from below/side: plain bounce, no extra energy
      const vn = f.vx*nx+f.vy*ny; if(vn<0){ f.vx -= (1+REST)*vn*nx; f.vy -= (1+REST)*vn*ny; }
    }
  }
}
function madFrogFling(b){

// Reachability analysis: sweep launch angles with the real physics (no random jitter)
function simShot(angle, maxContacts, mask){
  const R=L.pegR, r=L.ballR, rr=(R+r)*(R+r), dt=1/360;
  const t0={x:PIVOT.x+Math.cos(angle)*L.wandLen, y:PIVOT.y+Math.sin(angle)*L.wandLen};
  const b={x:t0.x,y:t0.y,vx:Math.cos(angle)*L.launch,vy:Math.sin(angle)*L.launch};
  const hits=[];
  for(let i=0;i<360*6 && hits.length<maxContacts;i++){
    b.vy+=L.grav*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    const sp=Math.hypot(b.vx,b.vy); if(sp>1450){ b.vx*=1450/sp; b.vy*=1450/sp; }
    if(b.x<L.wallL+r){ b.x=L.wallL+r; b.vx=Math.abs(b.vx)*0.85; }
    if(b.x>L.wallR-r){ b.x=L.wallR-r; b.vx=-Math.abs(b.vx)*0.85; }
    if(b.y<r){ b.y=r; b.vy=Math.abs(b.vy)*0.8; }
    for(let j=0;j<pegs.length;j++){ if(mask && !mask[j]) continue; const p=pegs[j]; const dx=b.x-p.x, dy=b.y-p.y, d2=dx*dx+dy*dy;
      if(d2<rr && d2>1e-4){ const d=Math.sqrt(d2), nx=dx/d, ny=dy/d; b.x=p.x+nx*(R+r); b.y=p.y+ny*(R+r);
        const vn=b.vx*nx+b.vy*ny; if(vn<0){ b.vx-=(1+REST)*vn*nx; b.vy-=(1+REST)*vn*ny; }
        if(!hits.includes(j)) hits.push(j); } }
    if(b.y>L.H+30) break;
  }
  return hits;
}
window.__reach = (step=0.0015, maxContacts=3)=>{
  const first=new Set(), within=new Set();
  for(let a=AIM_MIN; a<=AIM_MAX; a+=step){ const h=simShot(a,maxContacts); if(h.length){ first.add(h[0]); h.forEach(i=>within.add(i)); } }
  const n=pegs.length, miss=[...pegs.keys()].filter(i=>!first.has(i));
  const topMiss = miss.filter(i=>pegs[i].y < L.pegTop+200).map(i=>({x:Math.round(pegs[i].x),y:Math.round(pegs[i].y)}));
  return {n, firstContact:first.size, withinFirst3:within.size, unreachedWithin3:[...pegs.keys()].filter(i=>!within.has(i)).map(i=>({x:Math.round(pegs[i].x),y:Math.round(pegs[i].y)})), topRowFirstMiss:topMiss};
};
// peel test: first-contact set, clear it (as a real shot would), repeat until nothing new
window.__reachPeel = (step=0.0015)=>{
  const mask = pegs.map(()=>true), reached = new Set(); let rounds=0, firstRound=0;
  while(rounds<60){ rounds++; const got=new Set();

    if(rounds===1) firstRound=got.size;
    if(!got.size) break; got.forEach(i=>{ reached.add(i); mask[i]=false; }); }
  const un=[...pegs.keys()].filter(i=>!reached.has(i)).map(i=>({x:Math.round(pegs[i].x),y:Math.round(pegs[i].y)}));
  return {n:pegs.length, reachable:reached.size, firstContactFullBoard:firstRound, rounds, unreachable:un};

window.__swarmAt = (x,y)=>frogSwarm(x,y);
window.__forceCatch = ()=>{ const c=G.catcher; if(G.state!=='aim') return false; fire(); const b=G.balls[0]; b.x=c.x; b.y=L.catcherY-60; b.vx=0; b.vy=300; return true; };
function unstick(b){
  let removed = 0;

  if(!removed){ b.vx += rand(-200,200); b.vy -= 150; }
}
function realStep(rdt){
  if(G.meterFlash>0) G.meterFlash-=rdt;
  if(G.slowTimer>0){ G.slowTimer-=rdt; if(G.slowTimer<=0) G.timeScale = G.finale ? 2.5 : 1; }
  if(G.state!=='flying' && G.timeScale>1) G.timeScale=1;
  // aim nudging (buttons + keyboard)
  let rot = G.nudge*0.4;
  const k=G.keys; const kd = (k['arrowleft']||k['a']?1:0) - (k['arrowright']||k['d']?1:0);
  if(kd) rot += kd*(k.shift?0.2:1.0);

  G.hintT -= rdt*0; // hint fades only after first shot/drag
  if(G.state==='clearing'){
    G.clearTimer -= rdt;
    while(G.clearTimer<=0 && G.clearQueue.length){
      const p = G.clearQueue.shift(); p.alive=false; p.pop=1;
      burst(p.x,p.y,p.type==='orange'?'#ffb040':p.type==='power'?'#d47bff':'#7ff7ff',8,160);

      else if(G.seeds<=0){ G.state='lost'; loseSound(); }
      else { G.state='aim'; placePowerPeg(); }
    }
  }
  if(G.state==='won' && Math.random()<0.5) G.particles.push({x:rand(0,L.W),y:L.H+10,vx:rand(-60,60),vy:rand(-500,-200),life:rand(1.5,3),max:3,color:Math.random()<0.5?'#fff27a':'#9dff8a',r:rand(2,5),firefly:true});
  btnFire.classList.toggle('off', !(G.state==='aim'||G.state==='won'||G.state==='lost'));
  btnFire.textContent = (G.state==='won'||G.state==='lost') ? 'AGAIN' : 'FIRE';
}

// ---------- Drawing ----------
function drawSpr(spr, x, y, s=1){ const w=spr.width*s, h=spr.height*s; ctx.drawImage(spr, x-w/2, y-h/2, w, h); }
function drawPeg(p){
  let s = 1, a = 1;
  if(!p.alive){ if(p.pop<=0) return; s = 1+(1-p.pop)*1.2; a = p.pop; }
  ctx.globalAlpha = a;
  const spr = PEGSPR[p.type+(p.lit?'1':'0')];
  if(p.type==='power' && p.alive){
    const pulse = 0.5+0.5*Math.sin(G.time*4+p.ph);
    drawSpr(spr, p.x, p.y, s*(1+pulse*0.12));
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<5;i++){ const ang=G.time*1.6+i*TAU/5, d=L.pegR*1.6+pulse*5; drawSpr(GLOW_WHITE, p.x+Math.cos(ang)*d, p.y+Math.sin(ang)*d, 0.18+0.1*Math.sin(G.time*6+i)); }
    ctx.globalCompositeOperation='source-over';
  } else if(p.type==='orange' && !p.lit){
    drawSpr(spr, p.x, p.y, s*(1+0.04*Math.sin(G.time*3+p.ph)));
  } else drawSpr(spr, p.x, p.y, s);
  ctx.globalAlpha = 1;

function drawShaman(){

function drawWand(){

  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(G.aim+Math.PI/2);
  const cg=ctx.createLinearGradient(-cr,0,cr,0); cg.addColorStop(0,'#bff8ff'); cg.addColorStop(0.5,'#ffffff'); cg.addColorStop(1,'#7fd8ff');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.moveTo(0,-cr*1.6); ctx.lineTo(cr*0.8,0); ctx.lineTo(0,cr*1.1); ctx.lineTo(-cr*0.8,0); ctx.closePath(); ctx.fill();
  ctx.restore();
  if(G.state==='aim' && Math.random()<0.25) G.particles.push({x:t.x+rand(-4,4),y:t.y+rand(-4,4),vx:rand(-30,30),vy:rand(-60,-10),life:rand(0.4,0.8),max:0.8,color:'#fff2a0',r:rand(1.5,3),firefly:true});
}
function drawAimGuide(){
  if(G.state!=='aim') return;
  const t = wandTip(); let x=t.x,y=t.y,vx=Math.cos(G.aim)*L.launch,vy=Math.sin(G.aim)*L.launch;
  const dt=1/120, rr=(L.pegR+L.ballR)**2, dot=L.portrait?4.5:3.4;
  for(let i=0;i<60;i++){
    for(let k=0;k<2;k++){ vy+=L.grav*dt; x+=vx*dt; y+=vy*dt; }
    let hit=false; for(const p of pegs){ if(p.alive && (p.x-x)**2+(p.y-y)**2<rr){ hit=true; break; } }
    if(hit||x<L.wallL||x>L.wallR) break;
    if(i%2===0){ ctx.fillStyle=`rgba(255,240,170,${0.95-i/70})`; ctx.beginPath(); ctx.arc(x,y,dot,0,TAU); ctx.fill(); }
  }
}
function drawBall(b){
  const tr=b.trail;
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(let i=1;i<tr.length;i++){ const k=i/tr.length; ctx.strokeStyle=`rgba(255,${180+60*k|0},90,${k*0.55})`; ctx.lineWidth=L.ballR*1.6*k;
    ctx.beginPath(); ctx.moveTo(tr[i-1].x,tr[i-1].y); ctx.lineTo(tr[i].x,tr[i].y); ctx.stroke(); }
  drawSpr(GLOW_GOLD, b.x, b.y, L.ballR/18);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(BALLSPR, b.x-L.ballR, b.y-L.ballR);
}
function drawFrog(f){
  const fade = f.life<0.6? f.life/0.6 : 1;
  const img = IMG.frog, w = L.frogR*5.2, h = w*img.height/img.width;
  ctx.globalAlpha=fade;
  ctx.globalCompositeOperation='lighter'; drawSpr(GLOW_LIME, f.x, f.y, L.frogR/28); ctx.globalCompositeOperation='source-over';
  ctx.save(); ctx.translate(f.x,f.y);
  const ang = clamp(Math.atan2(f.vy, Math.abs(f.vx)+1)*0.6, -0.7, 0.7);
  ctx.scale(f.face,1); ctx.rotate(ang); ctx.scale(1+f.squash*0.15, 1-f.squash*0.15);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  ctx.restore(); ctx.globalAlpha=1;
}
function drawCatcher(){
  const c=G.catcher, x=c.x, y=L.catcherY;
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5; drawSpr(GLOW_LIME, x, y, L.catcherW/80); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  const w=L.catcherW*1.35, sleepImg=IMG.catcher, sh=w*sleepImg.height/sleepImg.width, bottom = y - sh*0.72 + sh;
  if(c.angry>0){
    const img=IMG.angry, h=w*img.height/img.width, shake = Math.sin(G.time*60)*3*Math.min(1,c.angry);
    ctx.drawImage(img, x-w/2+shake, bottom-h, w, h);
    if(Math.random()<0.15) G.particles.push({x:x+rand(-30,30),y:bottom-h*0.85,vx:rand(-40,40),vy:rand(-160,-80),life:0.8,max:0.8,color:'rgba(230,230,240,0.6)',r:rand(5,10),firefly:true});
    return;
  }
  const breathe = 1+Math.sin(G.time*2)*0.02;
  ctx.drawImage(sleepImg, x-w/2, y-sh*0.72, w, sh*breathe);
  const zc = c.grumble>0 ? 1 : 2, fs=L.portrait?1.4:1;
  ctx.textAlign='left';
  for(let i=0;i<zc;i++){
    const t=(G.time*0.6+i/zc)%1; ctx.globalAlpha=(1-t)*0.7;
    ctx.fillStyle='#e2d4ff'; ctx.font=`bold ${(16+t*22)*fs}px sans-serif`;
    ctx.fillText('z', x+w*0.1+t*40+Math.sin(t*6)*8, y-sh*0.6-t*80);
  }
  ctx.globalAlpha=1;
}
function drawAcorn(x,y,used,s=1){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.globalAlpha = used?0.22:1;
  const g=ctx.createRadialGradient(-4,2,1,0,6,16); g.addColorStop(0,'#f2b56a'); g.addColorStop(1,'#8a4f1c');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,6,12,15,0,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,230,180,0.8)'; ctx.beginPath(); ctx.ellipse(-4,2,3,6,0,0,TAU); ctx.fill();
  ctx.fillStyle='#5a3618'; ctx.beginPath(); ctx.ellipse(0,-6,15,8,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(30,15,5,0.6)'; ctx.lineWidth=1; for(let i=-10;i<=10;i+=5){ ctx.beginPath(); ctx.moveTo(i,-12); ctx.lineTo(i+3,-1); ctx.stroke(); }
  ctx.strokeStyle='#3a2210'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(3,-20); ctx.stroke();
  ctx.restore();
}
function hudText(t,x,y,size,color,align='left'){
  ctx.font=`bold ${size}px "Trebuchet MS",sans-serif`; ctx.textAlign=align;
  ctx.lineWidth=size*0.18; ctx.lineJoin='round'; ctx.strokeStyle='rgba(8,4,20,0.85)'; ctx.strokeText(t,x,y);
  ctx.fillStyle=color; ctx.fillText(t,x,y);
}
function drawMeter(){
  const m = meterPos(), k = clamp(G.meter/G.meterGoal,0,1), near = k>0.8;
  const pulse = 0.5+0.5*Math.sin(G.time*(near?10:3));
  ctx.save();
  ctx.fillStyle='rgba(8,4,24,0.75)'; ctx.strokeStyle='rgba(180,255,200,0.55)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(m.x-3,m.y-3,m.w+6,m.h+6,10); ctx.fill(); ctx.stroke();
  let fx,fy,fw,fh;
  if(m.horiz){ fx=m.x; fy=m.y; fw=m.w*k; fh=m.h; } else { fh=m.h*k; fx=m.x; fy=m.y+m.h-fh; fw=m.w; }
  if(k>0){
    const g = m.horiz ? ctx.createLinearGradient(m.x,0,m.x+m.w,0) : ctx.createLinearGradient(0,m.y+m.h,0,m.y);
    g.addColorStop(0,'#2fd6a0'); g.addColorStop(0.6,'#a6ff6a'); g.addColorStop(1,'#fff27a');
    ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(fx,fy,Math.max(fw,4),Math.max(fh,4),8); ctx.fill();
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35+0.4*pulse*(near?1:0.4);
    const tx = m.horiz? fx+fw : m.cx, ty = m.horiz? m.cy : fy;
    drawSpr(GLOW_LIME, tx, ty, near?1.1:0.7);
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  }
  if(G.meterFlash>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=G.meterFlash/1.2; ctx.fillStyle='#d8ffb0'; ctx.beginPath(); ctx.roundRect(m.x-3,m.y-3,m.w+6,m.h+6,10); ctx.fill(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
  ctx.restore();
  const label = 'Spore Meter';
  if(m.horiz){ hudText(label, m.x, m.y-8, 24, '#b6ff9a'); hudText(Math.floor(G.meter).toLocaleString()+' / '+G.meterGoal.toLocaleString(), m.x+m.w, m.y+m.h+26, 22, 'rgba(230,255,220,0.85)', 'right'); }
  else { ctx.save(); ctx.translate(m.cx, m.y+m.h+16); hudText('SPORE', 0, 10, 16, '#b6ff9a', 'center'); ctx.restore();
    hudText(Math.floor(G.meter/100)/10+'k', m.cx, m.y-12, 18, 'rgba(230,255,220,0.9)', 'center'); }
}
function drawHUD(){
  drawMeter();
  if(L.portrait){
    hudText('Score '+G.score.toLocaleString(), 26, 56, 42, '#ffe9b0');
    hudText('Orange: '+orangeLeft(), 26, 104, 34, '#ffb040');
    hudText('x'+multiplier(), 260, 104, 34, '#e7a6ff');
    // acorns 2x5 top-right
    for(let i=0;i<10;i++){ const col=i%5, row=Math.floor(i/5); drawAcorn(L.W-40-(4-col)*50, 50+row*62, i>=G.seeds, 1.25); }
    if(G.seeds>10) hudText('+'+(G.seeds-10), L.W-26, 190, 32, '#b6ff9a', 'right');
  } else {
    ctx.fillStyle='rgba(10,5,25,0.5)'; ctx.fillRect(8,20,58,10*48+20);
    for(let i=0;i<10;i++) drawAcorn(37, 50+i*48, i>=G.seeds);
    if(G.seeds>10) hudText('+'+(G.seeds-10),20,540,22,'#b6ff9a');
    hudText('Score '+G.score.toLocaleString(), 90, 55, 34, '#ffe9b0');
    hudText('Orange left: '+orangeLeft(), 90, 92, 24, '#ffb040');
    hudText('Seeds: '+G.seeds, 90, 124, 24, '#cfe8ff');
    hudText('x'+multiplier()+' multiplier', L.W-90, 55, 30, '#e7a6ff', 'right');
    hudText('Purple peg = Frog Swarm!  •  Fill the Spore Meter = free seed', L.W-90, 88, 20, 'rgba(255,255,255,0.8)', 'right');
    hudText("Don't wake the grumpy frog... he'll hurl your seed back!", L.W-90, 116, 20, 'rgba(255,200,190,0.8)', 'right');
  }
  if(G.state==='aim' && G.shots===0 && G.hintT>0){
    const msg = touchUI ? 'Drag to aim the wand  •  tap FIRE to shoot' : 'Move mouse to aim  •  click / Space to fire  •  ←/→ fine aim';
    const a = 0.65+0.35*Math.sin(G.time*3); ctx.globalAlpha=a;
    hudText(msg, L.W/2, L.pondY-30, L.portrait?30:28, '#fff6d0', 'center'); ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}
function fitFont(text, size, maxW){ ctx.font=`bold ${size}px "Trebuchet MS",sans-serif`; const w=ctx.measureText(text).width; return w>maxW? size*maxW/w : size; }
function drawOverlay(){
  if(G.state!=='won' && G.state!=='lost') return;
  ctx.fillStyle='rgba(5,2,15,0.62)'; ctx.fillRect(0,0,L.W,L.H);
  ctx.textAlign='center';
  const won = G.state==='won', cy = L.portrait? L.H*0.36 : 420;
  const title = won?'The Forest Glows!':'Out of Seeds…';
  const ts = fitFont(title, L.portrait?96:96, L.W*0.9);
  ctx.save(); ctx.shadowBlur=40; ctx.shadowColor= won?'#fff27a':'#9a6aff';
  hudText(title, L.W/2, cy, ts, won?'#fff6c0':'#d9c8ff', 'center'); ctx.restore();
  hudText('Score: '+G.score.toLocaleString(), L.W/2, cy+100, L.portrait?56:44, '#ffffff', 'center');
  const sub = won?'Every orange spore cleared. The shaman nods.':orangeLeft()+' orange pegs still glowing. Try again!';
  hudText(sub, L.W/2, cy+165, fitFont(sub, L.portrait?34:26, L.W*0.9), 'rgba(255,255,255,0.85)', 'center');
  const b=btnRect(), m=G.mouse||{x:-1,y:-1}, hov=inBtn(m);
  ctx.save(); ctx.fillStyle= hov?'#4fe0b0':'#2fb08a'; ctx.shadowColor='#4fe0b0'; ctx.shadowBlur=hov?30:14;
  ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,24); ctx.fill(); ctx.restore();
  ctx.fillStyle='#062018'; ctx.font=`bold ${L.portrait?48:34}px sans-serif`; ctx.fillText('Play Again', L.W/2, b.y+b.h*0.66);
  ctx.textAlign='left';
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#05030c'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // letterbox: dim stretched painting behind the board
  if(bgCanvas){ const s=Math.max(canvas.width/L.W, canvas.height/L.H); ctx.globalAlpha=0.35;
    ctx.drawImage(bgCanvas,(canvas.width-L.W*s)/2,(canvas.height-L.H*s)/2,L.W*s,L.H*s); ctx.globalAlpha=1; }
  ctx.setTransform(scale*dpr,0,0,scale*dpr,offX*dpr,offY*dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,L.W,L.H); ctx.clip();
  ctx.drawImage(bgCanvas,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const f of G.fireflies){ f.p+=0.01*f.s; const x=f.x+Math.sin(f.p*2)*30, y=f.y+Math.cos(f.p*1.3)*20; ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(f.p*5)); drawSpr(GLOW_FF,x,y,0.9); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  for(const p of pegs) drawPeg(p);
  drawAimGuide();
  drawShaman();
  drawWand();
  drawCatcher();
  for(const f of G.frogs) drawFrog(f);
  for(const b of G.balls) drawBall(b);
  ctx.globalCompositeOperation='lighter';
  for(const p of G.particles){ ctx.globalAlpha=clamp(p.life/p.max,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  for(const t of G.texts){ ctx.globalAlpha=clamp(t.life/t.max*1.5,0,1); ctx.font=`bold ${t.size}px "Trebuchet MS",sans-serif`; const hw=ctx.measureText(t.text).width/2+10; hudText(t.text,clamp(t.x,hw,L.W-hw),Math.max(t.y,t.size),t.size,t.color,'center'); }
  ctx.globalAlpha=1; ctx.textAlign='left';
  if(G.timeScale<1){ ctx.fillStyle='rgba(255,240,150,0.06)'; ctx.fillRect(0,0,L.W,L.H); }
  drawHUD();
  drawOverlay();
  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const rdt = Math.min(0.05,(now-last)/1000); last=now;
  G.fps = G.fps? G.fps*0.95+0.05/Math.max(rdt,0.001) : 60;
  if(G.state!=='loading'){
    const sim = rdt*G.timeScale, N=6;
    for(let i=0;i<N;i++) step(sim/N);
    realStep(rdt);
    draw();
  }
  requestAnimationFrame(frame);
}
function loadImg(k){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{IMG[k]=im;res();}; im.onerror=()=>rej(new Error('img '+k)); im.src=IMG_SRC[k]; }); }
Promise.all(Object.keys(IMG_SRC).map(loadImg)).then(()=>{ reset(); requestAnimationFrame(frame); })
  .catch(e=>{ console.error(e); });
})();
</script>
